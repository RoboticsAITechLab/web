<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype Gallery | Client Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-violet-600 selection:text-white">

    <header class="border-b border-zinc-800/80 bg-[#09090b]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
                <p class="text-[10px] font-bold tracking-[0.2em] uppercase text-zinc-500 mb-1">Client preview</p>
                <h1 class="font-display font-black text-2xl sm:text-3xl tracking-tight text-white">Gym Prototype Gallery</h1>
            </div>
            <span id="demo-count" class="inline-flex self-start items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/25">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                11 live demos
            </span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
        <p class="text-zinc-400 text-sm sm:text-base max-w-2xl mb-10 leading-relaxed">
            11 alag gym designs — sab mein Gemini AI coach (chat + tools). Photos, videos, pricing included. Top bar se switch karo.
        </p>

        <div id="gallery" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

        <p class="mt-12 text-center text-xs text-zinc-600">
            Interactive HTML prototypes · For client review only
        </p>
    </main>

    <script>
        const prototypes = [
            {
                file: 'modern_gym_prototype.html',
                name: 'AURA',
                tag: 'Luxury AI',
                tagClass: 'text-violet-400 bg-violet-500/10 border-violet-500/20',
                icon: 'A',
                iconClass: 'bg-gradient-to-tr from-violet-600 to-fuchsia-600 shadow-[0_0_20px_rgba(139,92,246,0.35)]',
                hover: 'hover:border-violet-500/50 card-glow-violet',
                desc: 'Modern luxury fitness — AI coach, BMI tools, Jaipur branding, violet glass UI.',
                bullets: ['Gemini AI chat + BMI', 'Violet / fuchsia', 'Membership toggles'],
                accent: 'text-violet-400 group-hover:text-violet-200'
            },
            {
                file: 'forge_hyper_athletics_prototype.html',
                name: 'FORGE',
                sub: 'Hyper-Athletics',
                tag: 'Cyber Elite',
                tagClass: 'text-orange-400 bg-orange-500/10 border-orange-500/20',
                icon: '//F',
                iconClass: 'bg-gradient-to-br from-[#ff5a00] to-red-600 shadow-[0_0_20px_rgba(255,90,0,0.35)] text-sm',
                hover: 'hover:border-orange-500/50 card-glow-orange',
                desc: 'Cyber elite training — FORGE AI core, orange/cyan neon, extended athlete flows.',
                bullets: ['FORGE AI core', 'Orange / cyan', 'Long-form sections'],
                accent: 'text-orange-400 group-hover:text-orange-200'
            },
            {
                file: 'prana_holistic_gym_prototype.html',
                name: 'PRANA',
                tag: 'Holistic',
                tagClass: 'text-[#D07C60] bg-orange-500/10 border-orange-500/20',
                icon: 'P',
                iconClass: 'bg-[#3C4A3E] text-[#FAF6F0] border border-[#8F9E8B]/40',
                hover: 'hover:border-orange-500/40',
                desc: 'Mind-body club — Ayurveda, yoga, pilates, breathing metronome, dosha AI, serene sand/olive UI.',
                bullets: ['Full holistic flows', 'Photos & class videos', 'Jaipur C-Scheme vibe'],
                accent: 'text-orange-400 group-hover:text-orange-200'
            },
            {
                file: 'zenith_wellness_prototype.html',
                name: 'ZENITH',
                tag: 'Wellness',
                tagClass: 'text-emerald-600 bg-emerald-500/10 border-emerald-500/20',
                icon: 'Z',
                iconClass: 'bg-emerald-600/20 text-emerald-600 border border-emerald-500/30',
                hover: 'hover:border-emerald-500/40',
                desc: 'Light boutique wellness — sage & cream, yoga, recovery, calm spa positioning.',
                bullets: ['Light theme', 'Serif elegance', 'Wellness pricing'],
                accent: 'text-emerald-400 group-hover:text-emerald-200'
            },
            {
                file: 'ironcore_brutalist_prototype.html',
                name: 'IRON CORE',
                tag: 'Brutalist',
                tagClass: 'text-yellow-400 bg-yellow-500/10 border-yellow-500/20',
                icon: 'IC',
                iconClass: 'bg-yellow-400 text-black text-sm font-black',
                hover: 'hover:border-yellow-500/50',
                desc: 'Raw warehouse gym — black/yellow, Bebas Neue, 24/7 strength, zero fluff.',
                bullets: ['Industrial UI', 'Bold typography', 'Day pass pricing'],
                accent: 'text-yellow-400 group-hover:text-yellow-200'
            },
            {
                file: 'pulse_studio_prototype.html',
                name: 'PULSE',
                tag: 'Boutique',
                tagClass: 'text-pink-400 bg-pink-500/10 border-pink-500/20',
                icon: 'P',
                iconClass: 'bg-gradient-to-br from-pink-500 to-cyan-400',
                hover: 'hover:border-pink-500/50',
                desc: 'HIIT & dance studio — pink/cyan gradients, music-driven classes, community vibe.',
                bullets: ['Gradient hero', 'Class cards', 'Free class CTA'],
                accent: 'text-pink-400 group-hover:text-pink-200'
            },
            {
                file: 'titan_elite_prototype.html',
                name: 'TITAN',
                tag: 'Gold Elite',
                tagClass: 'text-amber-400 bg-amber-500/10 border-amber-500/20',
                icon: 'T',
                iconClass: 'bg-gradient-to-br from-amber-400 to-amber-700 text-black',
                hover: 'hover:border-amber-500/40',
                desc: 'Private members club — gold/black, Playfair luxury, invitation-only positioning.',
                bullets: ['Gold accents', 'Executive tiers', 'Concierge modal'],
                accent: 'text-amber-400 group-hover:text-amber-200'
            },
            {
                file: 'apex_crossfit_prototype.html',
                name: 'APEX',
                tag: 'CrossFit',
                tagClass: 'text-rose-400 bg-rose-500/10 border-rose-500/20',
                icon: 'AX',
                iconClass: 'bg-rose-600 text-white text-xs font-black',
                hover: 'hover:border-rose-500/50',
                desc: 'CrossFit box — WOD board, red brutal UI, coaches, FAQ, gallery & metcon videos.',
                bullets: ['Live WOD schedule', 'Photo + video hub', '3-tier pricing'],
                accent: 'text-rose-400 group-hover:text-rose-200'
            },
            {
                file: 'nova_24x7_prototype.html',
                name: 'NOVA',
                tag: '24/7 Smart',
                tagClass: 'text-blue-400 bg-blue-500/10 border-blue-500/20',
                icon: 'N',
                iconClass: 'bg-blue-500 text-white font-mono text-sm',
                hover: 'hover:border-blue-500/50',
                desc: 'App-first 24/7 gym — face entry, live occupancy, AI plans, student pricing.',
                bullets: ['Live occupancy', 'App feature grid', 'Goal calculator'],
                accent: 'text-blue-400 group-hover:text-blue-200'
            },
            {
                file: 'elixir_womens_prototype.html',
                name: 'ELIXIR',
                tag: 'Women Only',
                tagClass: 'text-pink-500 bg-pink-500/10 border-pink-500/20',
                icon: 'E',
                iconClass: 'bg-gradient-to-br from-pink-400 to-purple-400 text-white',
                hover: 'hover:border-pink-400/50',
                desc: 'Women-only studio — class timetable, mama fit, blush UI, cycle-smart tool.',
                bullets: ['Weekly schedule table', 'Female coaches', '7-day free pass'],
                accent: 'text-pink-400 group-hover:text-pink-200'
            },
            {
                file: 'velocity_run_club_prototype.html',
                name: 'VELOCITY',
                tag: 'Run Club',
                tagClass: 'text-teal-400 bg-teal-500/10 border-teal-500/20',
                icon: 'V',
                iconClass: 'bg-teal-500 text-slate-900 font-black text-sm',
                hover: 'hover:border-teal-500/50',
                desc: 'Run club & endurance — group runs, pace calc, marathon camp, trail photos.',
                bullets: ['Weekly run calendar', 'Race footage', 'Pace predictor'],
                accent: 'text-teal-400 group-hover:text-teal-200'
            }
        ];

        const arrow = '<svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>';

        document.getElementById('gallery').innerHTML = prototypes.map(p => `
            <a href="${p.file}" class="group block rounded-2xl border border-zinc-800 bg-zinc-900/40 p-6 transition-all duration-300 hover:-translate-y-0.5 ${p.hover}">
                <div class="flex items-start justify-between gap-3 mb-5">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center font-display font-black text-lg text-white ${p.iconClass}">${p.icon}</div>
                    <span class="text-[10px] font-bold uppercase tracking-wider border px-2 py-1 rounded-md ${p.tagClass}">${p.tag}</span>
                </div>
                <h2 class="font-display font-black text-xl text-white ${p.accent} transition-colors">${p.name}</h2>
                ${p.sub ? `<p class="text-[10px] font-bold text-cyan-400 tracking-widest uppercase mb-2">${p.sub}</p>` : '<div class="mb-2"></div>'}
                <p class="text-sm text-zinc-400 mb-5 leading-relaxed">${p.desc}</p>
                <ul class="text-xs text-zinc-500 space-y-1 mb-6">
                    ${p.bullets.map(b => `<li>● ${b}</li>`).join('')}
                </ul>
                <span class="inline-flex items-center gap-2 font-display font-bold text-sm ${p.accent}">
                    Open prototype ${arrow}
                </span>
            </a>
        `).join('');

        document.querySelectorAll('.card-glow-violet').forEach(el => {
            el.addEventListener('mouseenter', () => el.style.boxShadow = '0 0 40px rgba(139,92,246,0.2)');
            el.addEventListener('mouseleave', () => el.style.boxShadow = '');
        });
        document.querySelectorAll('.card-glow-orange').forEach(el => {
            el.addEventListener('mouseenter', () => el.style.boxShadow = '0 0 40px rgba(255,90,0,0.2)');
            el.addEventListener('mouseleave', () => el.style.boxShadow = '');
        });
    </script>
</body>
</html>
